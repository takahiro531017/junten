<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0C1F3F">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ログイン</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:#0C1F3F;font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;color:#0F1B2D}
.box{width:min(360px,100%);background:#fff;border-radius:18px;padding:30px 26px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.mark{width:52px;height:52px;margin:0 auto 14px;border-radius:14px;background:linear-gradient(140deg,#3C7BEA,#1F5FD1);display:grid;place-items:center}
.mark svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:17px;margin:0 0 4px}
p{font-size:13px;color:#7A879B;margin:0 0 18px}
input[type=password]{width:100%;height:50px;border:1px solid #DDE3EB;border-radius:12px;padding:0 14px;font-size:17px;outline:0}
input[type=password]:focus{border-color:#1F5FD1;box-shadow:0 0 0 3px #EEF3FD}
label{display:flex;align-items:center;gap:8px;font-size:13px;color:#46546A;margin:12px 0 16px;text-align:left;cursor:pointer}
label input{width:18px;height:18px;accent-color:#1F5FD1}
button{width:100%;height:50px;border:0;border-radius:12px;background:#1F5FD1;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
.err{color:#CF2F2B;font-size:13px;min-height:20px;margin-top:10px}
</style>
</head>

  <p>このページは保護されています</p>

  <button id="go">開く</button>
  <div class="err" id="err"></div>
</form>

const KEY_STORE = 'junten.key';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));

async function deriveKey(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(PACK.salt), iterations: PACK.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function decryptPack(key) {
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PACK.iv) }, key, b64(PACK.data));
  return new TextDecoder().decode(plain);
}
function launch(html) { document.open(); document.write(html); document.close(); }

(async () => {
  if (!window.crypto || !crypto.subtle) { document.getElementById('err').textContent = 'このブラウザでは開けません（https で開いてください）'; return; }
  // 記憶した鍵があれば入力なしで開く
  try {
    const saved = localStorage.getItem(KEY_STORE);
    if (saved) {
      const key = await crypto.subtle.importKey('raw', b64(saved), 'AES-GCM', false, ['decrypt']);
      return launch(await decryptPack(key));
    }
  } catch (e) { try { localStorage.removeItem(KEY_STORE); } catch (_) {} }
  document.getElementById('pw').focus();
})();

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = '確認しています…'; err.textContent = '';
  try {
    const key = await deriveKey(document.getElementById('pw').value);
    const html = await decryptPack(key);
    if (document.getElementById('keep').checked) {
      try { localStorage.setItem(KEY_STORE, toB64(await crypto.subtle.exportKey('raw', key))); } catch (_) {}
    }
    launch(html);
  } catch (_) {
    err.textContent = 'パスワードが違います';
    btn.disabled = false; btn.textContent = '開く';
  }
});
})();
</script>
